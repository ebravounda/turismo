<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="innerGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="60%" stop-color="#4a90c4"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="150" cy="150" r="108"/>
    </clipPath>
    <path id="topArc" d="M 55,150 a 95,95 0 1,1 190,0" fill="none"/>
    <path id="bottomArc" d="M 62,170 a 95,95 0 0,0 176,0" fill="none"/>
  </defs>

  <!-- Outer orange ring -->
  <circle cx="150" cy="150" r="148" fill="#f0a500"/>
  <!-- Dark navy ring -->
  <circle cx="150" cy="150" r="140" fill="#1a2b5e"/>
  <!-- Inner gradient circle -->
  <circle cx="150" cy="150" r="108" fill="url(#innerGrad)"/>

  <!-- Ground / road -->
  <ellipse cx="150" cy="230" rx="80" ry="12" fill="rgba(0,0,0,0.15)" clip-path="url(#circleClip)"/>

  <!-- City silhouette -->
  <g clip-path="url(#circleClip)" fill="#c0670a" opacity="0.7">
    <rect x="80" y="155" width="18" height="50"/>
    <rect x="76" y="165" width="26" height="40"/>
    <!-- Dome -->
    <ellipse cx="89" cy="155" rx="13" ry="10"/>
    <rect x="105" y="170" width="14" height="35"/>
    <rect x="125" y="175" width="10" height="30"/>
  </g>

  <!-- Palm tree -->
  <g clip-path="url(#circleClip)">
    <rect x="209" y="145" width="5" height="65" fill="#8b4513" rx="2"/>
    <!-- Fronds -->
    <path d="M212,148 Q195,130 178,138" stroke="#2d7a2d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M212,148 Q200,125 210,112" stroke="#2d7a2d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M212,148 Q225,128 240,135" stroke="#2d7a2d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M212,148 Q228,140 245,148" stroke="#2d7a2d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M212,148 Q220,160 235,158" stroke="#2d7a2d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Tuk-tuk body -->
  <g clip-path="url(#circleClip)">
    <!-- Main body -->
    <rect x="108" y="175" width="78" height="42" rx="6" fill="#2980b9"/>
    <!-- Roof -->
    <path d="M115,175 L120,155 L175,155 L180,175 Z" fill="#1a5276"/>
    <!-- Windshield -->
    <path d="M122,174 L126,159 L172,159 L176,174 Z" fill="#aed6f1" opacity="0.8"/>
    <!-- White roof stripe -->
    <rect x="120" y="153" width="55" height="5" rx="2" fill="white"/>
    <!-- Side windows -->
    <rect x="112" y="177" width="22" height="16" rx="3" fill="#aed6f1" opacity="0.7"/>
    <rect x="137" y="177" width="22" height="16" rx="3" fill="#aed6f1" opacity="0.7"/>
    <rect x="162" y="177" width="22" height="16" rx="3" fill="#aed6f1" opacity="0.7"/>
    <!-- Yellow/orange front bumper accent -->
    <rect x="108" y="210" width="78" height="7" rx="3" fill="#f0a500"/>
    <!-- Headlights -->
    <circle cx="116" cy="207" r="5" fill="#f39c12"/>
    <circle cx="116" cy="207" r="3" fill="#fff"/>
    <circle cx="178" cy="207" r="5" fill="#f39c12"/>
    <circle cx="178" cy="207" r="3" fill="#fff"/>
    <!-- Front wheel -->
    <circle cx="143" cy="220" r="14" fill="#2c3e50"/>
    <circle cx="143" cy="220" r="8" fill="#7f8c8d"/>
    <circle cx="143" cy="220" r="3" fill="#bdc3c7"/>
    <!-- Rear wheel -->
    <circle cx="175" cy="222" r="12" fill="#2c3e50"/>
    <circle cx="175" cy="222" r="7" fill="#7f8c8d"/>
    <circle cx="175" cy="222" r="2.5" fill="#bdc3c7"/>
    <!-- Small front -->
    <path d="M108,190 Q95,192 92,205 L108,205 Z" fill="#2471a3"/>
    <circle cx="97" cy="218" r="11" fill="#2c3e50"/>
    <circle cx="97" cy="218" r="6" fill="#7f8c8d"/>
    <circle cx="97" cy="218" r="2.5" fill="#bdc3c7"/>
  </g>

  <!-- Stars -->
  <text x="32" y="158" font-size="18" fill="#f0a500" text-anchor="middle">★</text>
  <text x="268" y="158" font-size="18" fill="#f0a500" text-anchor="middle">★</text>

  <!-- Top text: TUK TUK NORRIS -->
  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="white" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">TUK TUK NORRIS</textPath>
  </text>

  <!-- Bottom text: NO HACEMOS RUTAS, HACEMOS LEYENDA -->
  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="12.5" fill="#f0a500" letter-spacing="1">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">NO HACEMOS RUTAS, HACEMOS LEYENDA</textPath>
  </text>
</svg>
